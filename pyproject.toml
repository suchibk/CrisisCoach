[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-coach"
version = "0.1.0"
description = "Local-first, safety-gated collision coaching prototype"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
reports = ["python-docx>=1.1"]
agent = ["langgraph>=0.2", "langchain>=0.3", "langchain-openai>=0.2"]
voice = ["httpx>=0.27"]
ui = ["streamlit>=1.50", "python-docx>=1.1", "httpx>=0.27"]
cloud = ["pinecone>=5", "elevenlabs>=1.9", "langsmith>=0.1"]
dev = ["pytest>=8", "pytest-cov>=5"]
browser = ["playwright>=1.50"]

[project.scripts]
crisis-coach = "crisis_coach.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"crisis_coach.domains.collision" = ["resources/*.json", "resources/*.md", "resources/knowledge/*/*"]
"crisis_coach.persistence" = ["migrations/*.sql", "migrations/*.md"]

"crisis_coach.practice" = ["fixtures/*.png", "fixtures/*.json"]
